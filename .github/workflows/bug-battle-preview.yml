name: Publish Bug Battle Preview

on:
  push:
    branches:
      - feature/two-player-bug-hunt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build preview
        run: npx tsc && npx vite build --base=/Factor-Bugs/bug-battle-preview/

      - name: Publish preview subfolder
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: bug-battle-preview
          keep_files: true
